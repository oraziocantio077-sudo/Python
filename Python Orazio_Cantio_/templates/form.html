<!-- templates/form.html -->

<!DOCTYPE html>

<html lang="it">

<head>

    <meta charset="UTF-8">

    <title>Compilazione del form</title>

    <script defer src="/static/script.js"></script>

</head>

<body>

    <form action="{{ url_for('mutuo_p') }}" method="POST">



    <label for="genere">Genere:</label>

    <input type="text" id="genere" name="genere" required>

   

    <br><br>



    <label for="stato_civile">Stato civile:</label>

    <input type="text" id="stato_civile" name="stato_civile" required>



     <br><br>



    <label for="numero_figli">Numero di figli:</label>

    <input type="text" id="numero_figli" name="numero_figli" required>



     <br><br>



    <label for="istruzione">Istruzione:</label>

    <input type="text" id="istruzione" name="istruzione" required>



     <br><br>



    <label for="reddito_richiedente">Reddito richiedente:</label>

    <input type="number" id="reddito_richiedente" name="reddito_richiedente" required>



     <br><br>



    <label for="reddito_co_richiedente">Reddito CO-Richiedente:</label>

    <input type="number" id="reddito_co_richiedente" name="reddito_co_richiedente" required>



    <br><br>



    <label for="loanamount">Importo mutuo</label>

    <input type="number" id="loanamount" name="loanamount" required>



     <br><br>



    <label for="durata_mutuo">Durata mutuo:</label>

    <input type="number" id="durata_mutuo" name="durata_mutuo" required>



    <br><br>



    <label for="self_employed">Lavoro autonomo</label>

    <input type="text" id="self_employed" name="self_employed" required>



    <br><br>



    <label for="property_area">Property Area (Rural, Semiurban, Urban)</label>

    <input type="text" id="property_area" name="property_area" required>



     <br><br>



    <label for="credit_history">Credit History (1, 0)</label>

    <input type="number" id="credit_history" name="credit_history" required>



    <br><br>



    <button type="submit">Invia Richiesta</button>



</form>

</body>

</html>

forniti dal backend tramite le route.-->
